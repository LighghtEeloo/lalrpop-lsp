[package]
name = "lalrpop-lsp"
version = "0.1.3"
edition = "2021"
description = "Language Server Protocol support for LALRPOP grammars"
license = "MIT"
repository = "https://github.com/LighghtEeloo/lalrpop-lsp"

[dependencies]
env_logger = "0.11.11"
tokio = { version = "1.53.1", features = ["full"] }
tower-lsp = { version = "0.20.0", features = ["proposed"] }
dashmap = { version = "6.2.1" }
lalrpop = { git = "https://github.com/LighghtEeloo/lalrpop.git", branch = "lsp", features = ["lsp"] }

[dev-dependencies]
futures = { version = "=0.3.34", default-features = false, features = ["async-await", "std"] }
serde_json = "1.0.151"
tower = { version = "0.5.3", features = ["util"] }
